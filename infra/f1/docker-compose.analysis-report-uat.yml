# Isolated overlay for analysis-report dual-identity UAT.
# Independent compose project/image/ports are supplied by analysis_report_uat.
# External embedding keys are not mounted. Default stack is unchanged.
# Must not impersonate material-rag or business UAT.
services:
  secret-init:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  postgres:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:?LOCAL_PG_PORT_REQUIRED}:5432"
  keycloak:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  keycloak-provisioner:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  minio:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  redis:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  clamd:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  migrator:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    command: ["python", "-B", "/app/infra/f1/analysis-reports/migrate.py"]
    environment:
      F1_MATERIAL_ANALYSIS_REPORT_LOCAL: "1"
      F1_LOCAL_ENGINEERING: "1"
  seed:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  verifier:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  migration-atomicity:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  business-verifier:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  ingestion-verifier:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  material-verifier:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  targeted-tests:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  backup-db:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  backup-minio:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  restore-db:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  restore-minio:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  api:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    environment:
      F1_MATERIAL_ANALYSIS_REPORT_LOCAL: "1"
      F1_LOCAL_ENGINEERING: "1"
      F1_EXTERNAL_PIPELINES_ENABLED: "false"
  worker:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  dispatcher:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  web:
    labels: !override
      io.anhuan.scope: analysis-report-uat
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"

