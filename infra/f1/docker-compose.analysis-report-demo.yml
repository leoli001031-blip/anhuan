# Isolated overlay for analysis-report local demo.
# Independent compose project/image/ports are supplied by analysis_report_demo.
# External embedding keys are not mounted. Default stack is unchanged.
# Must not impersonate material-rag, business UAT, or dual-identity UAT.
services:
  storage-secret-init:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["/bin/sh", "/init/storage_secret_init.sh"]
    network_mode: none
    read_only: true
    volumes:
      - ./analysis-reports/storage_secret_init.sh:/init/storage_secret_init.sh:ro
      - ${LOCAL_SECRETS_DIR:?LOCAL_SECRETS_DIR_REQUIRED}:/source:ro
      - api_secrets:/api
      - worker_secrets:/worker
      - ingestion_worker_secrets:/ingestion-worker
      - storage_provisioner_secrets:/storage-provisioner
      - source_gateway_secrets:/source-gateway
      - migrator_secrets:/migrator
      - report_worker_secrets:/report-worker
    labels:
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    restart: "no"
  storage-provisioner:
    image: ${LOCAL_RUNTIME_IMAGE:?LOCAL_RUNTIME_IMAGE_REQUIRED}
    command: ["python", "-B", "/app/infra/f1/analysis_report_storage.py"]
    environment:
      F1_LOCAL_ENGINEERING: "1"
      F1_SECRETS_DIR: /run/secrets/f1
      MINIO_ENDPOINT: minio:9000
    volumes:
      - storage_provisioner_secrets:/run/secrets/f1:ro
      - minio_secrets:/run/minio-root:ro
    networks: [localnet]
    labels:
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    restart: "no"
  source-gateway:
    image: ${LOCAL_RUNTIME_IMAGE:?LOCAL_RUNTIME_IMAGE_REQUIRED}
    command: ["uvicorn", "platform_foundation.f1.source_gateway:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log", "--limit-concurrency", "8"]
    environment:
      F1_LOCAL_ENGINEERING: "1"
      F1_STORAGE_SERVICE_CREDENTIALS: "1"
      F1_PREVIEW_CONTENT_ADDRESSED: "1"
      F1_OCR_RESULT_CACHE: "1"
      F1_OCR_CACHE_EPOCH: "${F1_OCR_CACHE_EPOCH:-1}"
      F1_SECRETS_DIR: /run/secrets/f1
      F1_SOURCE_READER_PASSWORD_FILE: /run/secrets/f1/f1_source_reader_password
      F1_PG_HOST: postgres
      F1_PG_PORT: "5432"
      F1_PG_DATABASE: ${LOCAL_DATABASE:?LOCAL_DATABASE_REQUIRED}
      MINIO_ENDPOINT: minio:9000
    volumes:
      - source_gateway_secrets:/run/secrets/f1:ro
    networks: [localnet]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    labels:
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    restart: unless-stopped
  secret-init:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  postgres:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:?LOCAL_PG_PORT_REQUIRED}:5432"
  keycloak:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  keycloak-provisioner:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  minio:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  redis:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  clamd:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  material-rag-ocr-init:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - /bin/sh
      - -ec
      - >-
        chown 65532:65532 /ocr;
        chmod 0700 /ocr
    network_mode: none
    read_only: true
    volumes:
      - material_ocr_socket:/ocr
    labels:
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    restart: "no"
  material-rag-ocr:
    image: sha256:02e6300f52463818de7ceaf447bfb0765e5f8466251177006131dec4e55a27f5
    pull_policy: never
    platform: linux/arm64
    entrypoint:
      ["/usr/local/bin/python3", "-I", "-B", "/opt/material-rag/ocr_server.py"]
    network_mode: none
    ipc: none
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../f0h/seccomp.json
    pids_limit: 64
    mem_limit: 1073741824
    memswap_limit: 1073741824
    cpus: 1.0
    shm_size: 67108864
    ulimits:
      core: 0
      nofile: {soft: 64, hard: 64}
      nproc: {soft: 64, hard: 64}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=65532,mode=0700
      - /work:rw,nosuid,nodev,noexec,size=256m,uid=65532,gid=65532,mode=0700
    volumes:
      - ./material-rag/ocr_server.py:/opt/material-rag/ocr_server.py:ro
      - material_ocr_socket:/run/material-rag-ocr
    depends_on:
      material-rag-ocr-init: {condition: service_completed_successfully}
    labels:
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    stop_grace_period: 1s
    logging: {driver: none}
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/python3",
          "-I",
          "-B",
          "-c",
          "import os,stat;paths=('/run/material-rag-ocr/request.fifo','/run/material-rag-ocr/response.fifo');ready='/run/material-rag-ocr/ready';raise SystemExit(0 if all(stat.S_ISFIFO(os.stat(p).st_mode) for p in paths) and stat.S_ISREG(os.stat(ready).st_mode) and stat.S_IMODE(os.stat(ready).st_mode)==384 else 1)",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  migrator:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    command: ["python", "-B", "/app/infra/f1/analysis-reports/migrate.py"]
    environment:
      F1_MATERIAL_ANALYSIS_REPORT_LOCAL: "1"
      F1_LOCAL_ENGINEERING: "1"
  seed:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  verifier:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  migration-atomicity:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  business-verifier:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  ingestion-verifier:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  material-verifier:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  targeted-tests:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  backup-db:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  backup-minio:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
  restore-db:
    labels: !override
