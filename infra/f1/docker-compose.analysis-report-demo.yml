  api:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    environment:
      F1_PIPELINE_COORDINATOR_GATEWAY: "1"
      F1_PIPELINE_CONTINUATIONS_ON_INGESTION: "1"
      F1_STORAGE_SERVICE_CREDENTIALS: "1"
      F1_PREVIEW_CONTENT_ADDRESSED: "1"
      F1_OCR_RESULT_CACHE: "1"
      F1_OCR_CACHE_EPOCH: "${F1_OCR_CACHE_EPOCH:-1}"
      F1_MATERIAL_ANALYSIS_REPORT_LOCAL: "1"
      F1_LOCAL_ENGINEERING: "1"
      F1_NATIVE_EVIDENCE_LOCAL: "1"
      F1_MATERIAL_QA_LOCAL_EXTRACTIVE: "1"
      F1_MATERIAL_AUTO_PIPELINE_LOCAL: "1"
      F1_MATERIAL_INGESTION_DURABLE_LOCAL: "1"
      F1_MATERIAL_RAG_LOCAL_INDEX: "1"
      F1_MATERIAL_OCR_ENABLED: "1"
      F1_EXTERNAL_PIPELINES_ENABLED: "false"
    volumes:
      - material_ocr_socket:/run/material-rag-ocr
    depends_on:
      material-rag-ocr: {condition: service_healthy}
  worker:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    environment:
      F1_PIPELINE_CONTINUATIONS_ON_INGESTION: "1"
      F1_TASK_SOURCE_GATEWAY: "1"
      F1_STORAGE_SERVICE_CREDENTIALS: "1"
      F1_PREVIEW_CONTENT_ADDRESSED: "1"
      F1_OCR_RESULT_CACHE: "1"
      F1_OCR_CACHE_EPOCH: "${F1_OCR_CACHE_EPOCH:-1}"
      F1_LOCAL_ENGINEERING: "1"
      F1_NATIVE_EVIDENCE_LOCAL: "1"
      F1_MATERIAL_AUTO_PIPELINE_LOCAL: "1"
      F1_MATERIAL_RAG_LOCAL_INDEX: "1"
      F1_MATERIAL_OCR_ENABLED: "1"
    volumes:
      - material_ocr_socket:/run/material-rag-ocr
    depends_on:
      source-gateway: {condition: service_healthy}
      material-rag-ocr: {condition: service_healthy}
  dispatcher:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    environment:
      F1_PIPELINE_CONTINUATIONS_ON_INGESTION: "1"
      F1_MATERIAL_ANALYSIS_REPORT_LOCAL: "1"
      F1_LOCAL_ENGINEERING: "1"
      F1_NATIVE_EVIDENCE_LOCAL: "1"
      F1_MATERIAL_AUTO_PIPELINE_LOCAL: "1"
      F1_MATERIAL_INGESTION_DURABLE_LOCAL: "1"
      F1_MATERIAL_RAG_LOCAL_INDEX: "1"
      F1_MATERIAL_OCR_ENABLED: "1"
  ingestion-worker:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    environment:
      F1_INGESTION_WORKER_RESTRICTED: "1"
      F1_INGESTION_WORKER_PASSWORD_FILE: /run/secrets/f1/f1_ingestion_worker_password
      F1_PIPELINE_COORDINATOR_GATEWAY: "1"
      F1_PIPELINE_CONTINUATIONS_ON_INGESTION: "1"
      F1_TASK_SOURCE_GATEWAY: "1"
      F1_STORAGE_SERVICE_CREDENTIALS: "1"
      F1_PREVIEW_CONTENT_ADDRESSED: "1"
      F1_OCR_RESULT_CACHE: "1"
      F1_OCR_CACHE_EPOCH: "${F1_OCR_CACHE_EPOCH:-1}"
      F1_MATERIAL_ANALYSIS_REPORT_LOCAL: "1"
      F1_LOCAL_ENGINEERING: "1"
      F1_NATIVE_EVIDENCE_LOCAL: "1"
      F1_MATERIAL_AUTO_PIPELINE_LOCAL: "1"
      F1_MATERIAL_INGESTION_DURABLE_LOCAL: "1"
      F1_MATERIAL_RAG_LOCAL_INDEX: "1"
      F1_MATERIAL_OCR_ENABLED: "1"
    volumes:
      - material_ocr_socket:/run/material-rag-ocr
    depends_on:
      api: {condition: service_healthy}
      source-gateway: {condition: service_healthy}
      material-rag-ocr: {condition: service_healthy}
  report-worker:
    labels: !override
      io.anhuan.scope: analysis-report-demo
      io.anhuan.project-id: "${LOCAL_PROJECT_ID:?LOCAL_PROJECT_ID_REQUIRED}"
    environment:
      F1_PIPELINE_CONTINUATIONS_ON_INGESTION: "1"
      F1_REPORT_WORKER_RESTRICTED: "1"
      F1_REPORT_WORKER_PASSWORD_FILE: /run/secrets/f1/f1_report_worker_password
      F1_MATERIAL_ANALYSIS_REPORT_LOCAL: "1"
      F1_LOCAL_ENGINEERING: "1"
